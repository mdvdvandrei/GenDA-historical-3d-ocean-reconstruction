[project]
name = "genda-historical-3d-ocean-reconstruction"
version = "0.1.0"
description = "GenDA historical 3D ocean reconstruction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cartopy>=0.24.1",
    "cftime>=1.6.4.post1",
    "earth2grid>=2025.6.1",
    "h5netcdf>=1.6.1",
    "matplotlib>=3",
    "netCDF4>=1.7.0",
    "numpy>=1.25.0",
    "pandas>=2.2.3",
    "Pillow>=10.0.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.1.0",
    "s3fs>=2025.3.2",
    "scipy>=1",
    "tensorboard>=2.16.0",
    "torch>=2.5.0",
    "torchmetrics>=1.0.0",
    "tqdm>=4.67.1",
    "xarray>=2025.3.1",
    "zarr>=3.0.7",
    "zict>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbottle"]

[tool.ruff]
line-length = 88
